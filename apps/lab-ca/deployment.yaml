apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-ca
  namespace: lab-ca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-ca
  template:
    metadata:
      labels:
        app: lab-ca
    spec:
      priorityClassName: system-cluster-critical
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: files
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: files
          configMap:
            name: lab-ca-files
