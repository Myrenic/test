apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
spec:
  chart:
    spec:
      chart: sonarr
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
      version: "16.3.2"
  interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: sonarr-values
      valuesKey: values.yaml
