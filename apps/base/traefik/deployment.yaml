---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-sa
      containers:
        - name: traefik
          image: traefik:v3.5.2
          args:
            - --log.level=INFO
            - --log.format=json
            - --api.dashboard=true
            - --api.insecure=true
            - --entrypoints.web.address=:80
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.websecure.address=:443
            - --providers.kubernetesingress.ingressclass=traefik
            - --providers.kubernetesingress.ingressendpoint.hostname=test.com
            - --providers.kubernetescrd
            - --providers.kubernetescrd.allowCrossNamespace=true
            - --accesslog=true
            - --accesslog.filepath=/var/log/traefik/traefik.log
            - --accesslog.filters.statuscodes=100-599
            - --accesslog.format=json
            - --accesslog.fields.headers.defaultmode=keep
          ports:
            - containerPort: 80
              name: web
            - containerPort: 443
              name: websecure
            - containerPort: 8080
              name: admin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: traefik-logs
              mountPath: /var/log/traefik
      volumes:
        - name: acme-storage
          persistentVolumeClaim:
            claimName: traefik-acme-pvc
        - name: traefik-logs
          persistentVolumeClaim:
            claimName: traefik-logs-pvc
