apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/myrenic/test.git
    targetRevision: HEAD
    path: kubernetes/apps
    directory:
      recurse: true
      include: '**/application.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
