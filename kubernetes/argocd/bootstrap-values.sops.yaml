configs:
    params:
        server.insecure: true
    cmp:
        create: true
        plugins:
            helm-sops:
                discover:
                    fileName: ./Chart.yaml
                generate:
                    command:
                        - sh
                        - -ec
                    args:
                        - |
                          repo_root="$(git rev-parse --show-toplevel)"
                          temp_dir="$(mktemp -d)"
                          trap 'rm -rf "$temp_dir"' EXIT
                          value_args=""

                          for values_file in \
                            values.yaml \
                            values.sops.yaml \
                            "${repo_root}/kubernetes/common/cluster-values.yaml" \
                            "${repo_root}/kubernetes/common/cluster-values.sops.yaml"
                          do
                            if [ ! -f "${values_file}" ]; then
                              continue
                            fi

                            case "${values_file}" in
                              *.sops.yaml)
                                output_file="${temp_dir}/$(basename "${values_file}" .sops.yaml).yaml"
                                sops -d "${values_file}" > "${output_file}"
                                value_args="${value_args} -f ${output_file}"
                                ;;
                              *)
                                value_args="${value_args} -f ${values_file}"
                                ;;
                            esac
                          done

                          helm template "${ARGOCD_APP_NAME}" . \
                            --namespace "${ARGOCD_APP_NAMESPACE}" \
                            --include-crds \
                            ${value_args}
    secret:
        argocdServerAdminPassword: $2b$10$D/a/LI3zbxgSAmqFUiOtverxfNYyP44DeHg6ZinhNof8MrplNhgjm
        argocdServerAdminPasswordMtime: "2026-05-12T16:28:02Z"
repoServer:
    initContainers:
        - name: install-sops-tools
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              apk add --no-cache curl tar
              curl -fsSL -o /gitops-tools/sops "https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64"
              curl -fsSL -o /tmp/age.tar.gz "https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz"
              tar -xzf /tmp/age.tar.gz -C /tmp
              install -m 0755 /tmp/age/age /gitops-tools/age
              chmod 0755 /gitops-tools/sops
          volumeMounts:
            - name: gitops-tools
              mountPath: /gitops-tools
    extraContainers:
        - name: cmp-helm-sops
          image: quay.io/argoproj/argocd:v3.0.5
          imagePullPolicy: IfNotPresent
          command:
            - /var/run/argocd/argocd-cmp-server
          env:
            - name: PATH
              value: /gitops-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: SOPS_AGE_KEY_FILE
              value: /helm-secrets-age/keys.txt
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: argocd-cmp-cm
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: helm-sops.yaml
            - name: cmp-tmp
              mountPath: /tmp
            - name: gitops-tools
              mountPath: /gitops-tools
            - name: sops-age-key
              mountPath: /helm-secrets-age
              readOnly: true
    volumes:
        - name: argocd-cmp-cm
          configMap:
            name: argocd-cmp-cm
        - name: gitops-tools
          emptyDir: {}
        - name: cmp-tmp
          emptyDir: {}
        - name: sops-age-key
          secret:
            secretName: argocd-sops-age-key
