apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: tailscale-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-subnet-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-subnet-router
    spec:
      serviceAccountName: tailscale-subnet-router
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.96.5
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_KUBE_SECRET
              value: tailscale-subnet-router
            - name: TS_USERSPACE
              value: "false"
            - name: TS_DEBUG_FIREWALL_MODE
              value: auto
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              value: lab-k8s-subnet-router
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_ROUTES
              value: 10.0.3.0/24,10.96.0.0/12,10.244.0.0/16
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
