{{- $cfg := index .Values "tailscale" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cfg.serviceAccountName }}
  namespace: {{ $cfg.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cfg.roleName }}
  namespace: {{ $cfg.namespace.name }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cfg.roleName }}
  namespace: {{ $cfg.namespace.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $cfg.serviceAccountName }}
    namespace: {{ $cfg.namespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $cfg.roleName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $cfg.deploymentName }}
  namespace: {{ $cfg.namespace.name }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $cfg.deploymentName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $cfg.deploymentName }}
    spec:
      serviceAccountName: {{ $cfg.serviceAccountName }}
      containers:
        - name: tailscale
          image: {{ $cfg.image.repository }}:{{ $cfg.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_KUBE_SECRET
              value: {{ $cfg.stateSecretName }}
            - name: TS_USERSPACE
              value: "false"
            - name: TS_DEBUG_FIREWALL_MODE
              value: auto
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              value: {{ $cfg.hostname | quote }}
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_ROUTES
              value: {{ join "," $cfg.routes | quote }}
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.authSecretName }}
                  key: {{ $cfg.authSecretKey }}
          securityContext:
            privileged: true
          resources:
{{ toYaml $cfg.resources | indent 12 }}
