apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: oauth2-proxy
  sources:
    - repoURL: https://oauth2-proxy.github.io/manifests
      chart: oauth2-proxy
      targetRevision: 10.4.3
      helm:
        valuesObject:
          fullnameOverride: oauth2-proxy
          replicaCount: 2
          config:
            existingSecret: oauth2-proxy-secrets
            configFile: |
              provider = "oidc"
              oidc_issuer_url = "https://login.microsoftonline.com/d18a2568-9941-4c45-9cb0-cb9cda2e9c31/v2.0"
              email_domains = [ "*" ]
              redirect_url = "https://auth.tuntelder.com/oauth2/callback"
              cookie_domains = [ ".tuntelder.com" ]
              whitelist_domains = [ ".tuntelder.com" ]
              reverse_proxy = true
              set_xauthrequest = true
              cookie_secure = true
              scope = "openid email profile"
              upstreams = [ "static://202" ]
              http_address = "0.0.0.0:4180"
          ingress:
            enabled: true
            className: traefik
            hosts:
              - auth.tuntelder.com
            tls:
              - secretName: auth-tls
                hosts:
                  - auth.tuntelder.com
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
