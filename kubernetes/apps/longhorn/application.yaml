apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.8.1
      helm:
        valuesObject:
          defaultSettings:
            defaultReplicaCount: 2
            defaultDataLocality: best-effort
          persistence:
            defaultClassReplicaCount: 2
          longhornUI:
            replicas: 1
    - repoURL: https://github.com/myrenic/test.git
      targetRevision: HEAD
      path: kubernetes/apps/longhorn
      directory:
        include: namespace.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
