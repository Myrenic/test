apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 36.4.0
      helm:
        valuesObject:
          ingressClass:
            enabled: true
            isDefaultClass: true
          service:
            type: LoadBalancer
          ports:
            web:
              redirections:
                entryPoint:
                  to: websecure
            websecure:
              tls:
                enabled: true
          providers:
            kubernetesCRD:
              enabled: true
              allowCrossNamespace: true
            kubernetesIngress:
              enabled: true
          logs:
            general:
              level: INFO
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
