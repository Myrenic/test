apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 40.1.0
      helm:
        valuesObject:
          ingressClass:
            enabled: true
            isDefaultClass: true
          service:
            annotations:
              metallb.io/address-pool: lan-pool
            spec:
              type: LoadBalancer
              loadBalancerIP: 10.0.3.70
              externalTrafficPolicy: Local
          ports:
            web:
              http:
                redirections:
                  entryPoint:
                    to: websecure
                    scheme: https
                    permanent: true
          providers:
            kubernetesCRD:
              enabled: true
              allowCrossNamespace: true
            kubernetesIngress:
              enabled: true
          logs:
            general:
              level: INFO
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
