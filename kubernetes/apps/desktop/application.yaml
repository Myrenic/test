apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: desktop
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: desktop
  source:
    repoURL: https://github.com/myrenic/test.git
    targetRevision: HEAD
    path: kubernetes/apps/desktop
    directory:
      recurse: true
      exclude: application.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
