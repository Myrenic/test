name: Deploy to Lab Cluster
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: fluxcd/pkg/actions/kustomize@main

      - name: Validate infrastructure controllers
        run: kustomize build infrastructure/controllers

      - name: Validate infrastructure configs
        run: kustomize build infrastructure/configs

      - name: Validate apps
        run: kustomize build apps

  build-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: |
            ghcr.io/myrenic/k8s-dashboard:latest
            ghcr.io/myrenic/k8s-dashboard:${{ github.sha }}

  deploy:
    needs: [validate, build-dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flux
        uses: fluxcd/flux2/action@main

      - name: Setup SOPS
        uses: mdgreenwald/mozilla-sops-action@v1.6.0

      - name: Reconcile
        run: |
          echo "Deployment triggered. Flux will reconcile from git."
          echo "Dashboard image updated to ghcr.io/${{ github.repository_owner }}/k8s-dashboard:${{ github.sha }}"
