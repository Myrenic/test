apiVersion: v1
kind: Namespace
metadata:
  name: netbird
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird-client
  namespace: netbird
  labels:
    app: netbird
spec:
  selector:
    matchLabels:
      app: netbird
  template:
    metadata:
      labels:
        app: netbird
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: netbird
          image: netbirdio/netbird:latest
          command: ["/bin/sh"]
          args:
            - -ec
            - |
              /usr/local/bin/netbird service run \
                --setup-key-file /etc/netbird/setup-key \
                --management-url https://api.netbird.io \
                --hostname "${NODE_NAME}" \
                --log-file console \
                --log-level info &
              pid="$!"

              for _ in $(seq 1 30); do
                [ -S /var/run/netbird.sock ] && break
                sleep 1
              done

              status="$(/usr/local/bin/netbird status 2>/dev/null || true)"
              case "$status" in
                *Connected*) ;;
                *)
                  /usr/local/bin/netbird up \
                    --setup-key-file /etc/netbird/setup-key \
                    --management-url https://api.netbird.io \
                    --hostname "${NODE_NAME}" \
                    --log-file console
                  ;;
              esac

              wait "$pid"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_RESOURCE
            privileged: true
          volumeMounts:
            - name: setup-key
              mountPath: /etc/netbird
              readOnly: true
            - name: state
              mountPath: /var/lib/netbird
          env:
            - name: NB_LOG_LEVEL
              value: info
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: setup-key
          secret:
            secretName: netbird-setup-key
        - name: state
          hostPath:
            path: /var/lib/netbird
            type: DirectoryOrCreate
