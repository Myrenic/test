apiVersion: v1
kind: Namespace
metadata:
  name: netbird
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird-client
  namespace: netbird
  labels:
    app: netbird
spec:
  selector:
    matchLabels:
      app: netbird
  template:
    metadata:
      labels:
        app: netbird
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: netbird
          image: netbirdio/netbird:latest
          command: ["/usr/local/bin/netbird"]
          args: ["up", "--setup-key-file", "/etc/netbird/setup-key", "--management-url", "https://api.netbird.io"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_RESOURCE
            privileged: true
          volumeMounts:
            - name: setup-key
              mountPath: /etc/netbird
              readOnly: true
            - name: config
              mountPath: /etc/netbird-config
          env:
            - name: NB_LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: setup-key
          secret:
            secretName: netbird-setup-key
        - name: config
          emptyDir: {}
