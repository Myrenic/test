# local-path-provisioner — lightweight storage for Talos Linux
# NOTE: Longhorn requires iscsi-tools Talos extension. When Omni access
#       is available, add the extension and switch back to Longhorn for
#       replicated storage across nodes.
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 24h
  url: https://charts.containeroo.ch
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 30m
  chart:
    spec:
      chart: local-path-provisioner
      version: "0.0.*"
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
      interval: 12h
  values:
    storageClass:
      name: local-path
      defaultClass: true
      reclaimPolicy: Retain
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/local-path-provisioner
