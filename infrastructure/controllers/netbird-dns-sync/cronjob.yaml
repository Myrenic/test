apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbird-dns-sync
  namespace: netbird
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: netbird-dns-sync
          restartPolicy: OnFailure
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: sync
              image: python:3.12-alpine
              command: ["python", "/app/sync.py"]
              env:
                - name: NETBIRD_ZONE_ID
                  value: d819v7rl0ubs73fjensg
                - name: NETBIRD_ZONE_DOMAIN
                  value: lab.internal
                - name: NETBIRD_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: netbird-api
                      key: token
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: script
              configMap:
                name: netbird-dns-sync
                defaultMode: 0555
