# Lightweight etcd for ExternalDNS CoreDNS provider
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: external-dns
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.21
          command:
            - etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd.external-dns.svc:2379
            - --data-dir=/var/lib/etcd
          ports:
            - containerPort: 2379
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: external-dns
spec:
  selector:
    app: etcd
  ports:
    - port: 2379
      targetPort: 2379
