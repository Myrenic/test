apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/external-dns
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.16.*"
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 12h
  values:
    provider:
      name: coredns
    sources:
      - ingress
      - service
    policy: upsert-only
    registry: txt
    txtOwnerId: lab-cluster
    env:
      - name: ETCD_URLS
        value: http://etcd.external-dns.svc:2379
    replicaCount: 1
    podDisruptionBudget:
      minAvailable: 1
