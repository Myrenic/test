apiVersion: v1
kind: Namespace
metadata:
  name: sops-operator
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sops-secrets-operator
  namespace: sops-operator
spec:
  interval: 24h
  url: https://isindir.github.io/sops-secrets-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sops-secrets-operator
  namespace: sops-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: sops-secrets-operator
      version: "0.*"
      sourceRef:
        kind: HelmRepository
        name: sops-secrets-operator
      interval: 12h
  values:
    secretsAsFiles:
      - name: age-key
        mountPath: /etc/sops-age
        secretName: sops-age-key
    extraEnv:
      - name: SOPS_AGE_KEY_FILE
        value: /etc/sops-age/age.agekey
