<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>K8s Dashboard</title>
    <link data-trunk rel="rust" data-wasm-opt="z" data-target-name="dashboard_frontend" />
    <style>
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
            --green: #3fb950; --red: #f85149; --yellow: #d29922; --orange: #db6d28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: var(--bg); color: var(--text); }
        .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
        header h1 { font-size: 1.4rem; color: var(--accent); }
        .status-badge { padding: 0.3rem 0.8rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .status-healthy { background: #0d2818; color: var(--green); border: 1px solid var(--green); }
        .status-unhealthy { background: #2d1117; color: var(--red); border: 1px solid var(--red); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
        .card h2 { font-size: 1rem; color: var(--accent); margin-bottom: 0.8rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .card h3 { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 0.5rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; color: var(--text-dim); padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
        td { padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
        .tag { display: inline-block; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
        .tag-ready { background: #0d2818; color: var(--green); }
        .tag-notready { background: #2d1117; color: var(--red); }
        .tag-running { background: #0d2818; color: var(--green); }
        .tag-crash { background: #2d1117; color: var(--red); }
        .tag-pending { background: #2d1f0e; color: var(--yellow); }
        .tag-warning { background: #2d1f0e; color: var(--yellow); }
        .tag-normal { background: #0d1f2d; color: var(--accent); }
        .tag-failed { background: #2d1117; color: var(--red); }
        .problem-section { margin-bottom: 1rem; }
        .problem-count { font-size: 2.5rem; font-weight: 700; }
        .problem-label { font-size: 0.8rem; color: var(--text-dim); }
        .event-row { font-size: 0.75rem; }
        .event-time { color: var(--text-dim); white-space: nowrap; }
        .loading { text-align: center; padding: 3rem; color: var(--text-dim); }
        .problems-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.8rem; text-align: center; }
        .full-width { grid-column: 1 / -1; }
        .scrollable { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
