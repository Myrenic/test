apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lab-cluster
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/myrenic/test
  ref:
    branch: main
  secretRef:
    name: github-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: lab-cluster
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/configs
  prune: true
  sourceRef:
    kind: GitRepository
    name: lab-cluster
  dependsOn:
    - name: infrastructure-controllers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: lab-cluster
  dependsOn:
    - name: infrastructure-configs
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 10m
