apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
  namespace: media
spec:
  interval: 5m
  chart:
    spec:
      chart: lidarr
      version: 26.6.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      stopAll: false
    image:
      repository: ghcr.io/trueforge-org/lidarr
      tag: 2.14.4@sha256:b4736a4cc10bc588b6b1fbfee45880804fcecb73e1e34507ad2c4c14b1114608
      media:
        enabled: true
        existingClaim: media-nfs-pvc
        mountPath: /Media
    metrics:
      main:
        enabled: false